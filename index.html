<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2EADA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кубики">
<title>Кубики</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <button class="icon-button" id="btn-menu" type="button" aria-label="Меню">‹</button>
    <div class="level-badge">
      <span class="level-caption">Уровень</span>
      <span id="level-number">1</span>
      <span class="level-goal" id="level-goal"></span>
    </div>
    <button class="icon-button" id="btn-settings" type="button" aria-label="Настройки">⚙</button>
  </div>
  <div class="hud-bottom">
    <button class="tool" id="btn-undo" type="button">
      <span class="tool-icon">↺</span><span class="tool-label">Отменить</span><span class="tool-badge" id="undo-badge">3</span>
    </button>
    <button class="tool" id="btn-hint" type="button">
      <span class="tool-icon">?</span><span class="tool-label">Подсказка</span><span class="tool-badge" id="hint-badge">2</span>
    </button>
    <button class="tool" id="btn-post" type="button">
      <span class="tool-icon">+</span><span class="tool-label">Столбик</span><span class="tool-badge" id="post-badge">1</span>
    </button>
  </div>
</div>

<div id="screen-loading" class="screen">
  <div class="logo">Кубики</div>
  <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
</div>

<div id="screen-menu" class="screen hidden">
  <div class="menu-card">
    <div class="logo">Кубики</div>
    <p class="menu-note">В каждом режиме свой город</p>
    <div class="modes" id="mode-list">
      <button class="mode-card" id="mode-easy" type="button" data-mode="easy">
        <canvas class="mode-city" id="mode-city-easy" width="600" height="144"></canvas>
        <span class="mode-title">Лёгкий</span>
        <span class="mode-progress" id="mode-progress-easy">Не начат</span>
        <span class="mode-stars" id="mode-stars-easy"></span>
      </button>
      <button class="mode-card" id="mode-normal" type="button" data-mode="normal">
        <canvas class="mode-city" id="mode-city-normal" width="600" height="144"></canvas>
        <span class="mode-title">Средний</span>
        <span class="mode-progress" id="mode-progress-normal">Не начат</span>
        <span class="mode-stars" id="mode-stars-normal"></span>
      </button>
      <button class="mode-card" id="mode-hard" type="button" data-mode="hard">
        <canvas class="mode-city" id="mode-city-hard" width="600" height="144"></canvas>
        <span class="mode-title">Сложный</span>
        <span class="mode-progress" id="mode-progress-hard">Не начат</span>
        <span class="mode-stars" id="mode-stars-hard"></span>
      </button>
    </div>
    <div class="menu-row menu-row-end">
      <button class="link" id="btn-menu-settings" type="button">Настройки</button>
    </div>
  </div>
</div>

<div id="screen-win" class="screen hidden">
  <div class="menu-card">
    <div class="win-title">Уровень пройден</div>
    <div class="stars" id="win-stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="win-stats" id="win-stats">Ходов: 0</div>
    <div class="win-city" id="win-city">В городе прибавилось домов: 0</div>
    <button class="primary" id="btn-next" type="button">Далее</button>
  </div>
</div>

<div id="screen-settings" class="screen hidden">
  <div class="menu-card">
    <div class="win-title">Настройки</div>
    <button class="toggle" id="btn-restart" type="button">Начать уровень заново<span class="toggle-state">⟳</span></button>
    <button class="toggle" id="btn-sound" type="button">Звук<span class="toggle-state" id="sound-state">вкл</span></button>
    <button class="toggle" id="btn-vibro" type="button">Вибрация<span class="toggle-state" id="vibro-state">вкл</span></button>
    <button class="toggle danger" id="btn-reset" type="button">Сбросить прогресс</button>
    <button class="primary" id="btn-close-settings" type="button">Закрыть</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
