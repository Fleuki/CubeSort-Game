<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2EADA">
<title>Кубики</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <button class="icon-button" id="btn-menu" type="button" aria-label="Меню">‹</button>
    <div class="level-badge"><span class="level-caption">Уровень</span><span id="level-number">1</span></div>
    <button class="icon-button" id="btn-settings" type="button" aria-label="Настройки">⚙</button>
  </div>
  <div class="hud-bottom">
    <button class="tool" id="btn-undo" type="button">
      <span class="tool-icon">↺</span><span class="tool-label">Отменить</span><span class="tool-badge" id="undo-badge">3</span>
    </button>
    <button class="tool" id="btn-hint" type="button">
      <span class="tool-icon">?</span><span class="tool-label">Подсказка</span><span class="tool-badge" id="hint-badge">2</span>
    </button>
    <button class="tool" id="btn-post" type="button">
      <span class="tool-icon">+</span><span class="tool-label">Столбик</span><span class="tool-badge" id="post-badge">1</span>
    </button>
  </div>
</div>

<div id="screen-loading" class="screen">
  <div class="logo">Кубики</div>
  <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
</div>

<div id="screen-menu" class="screen hidden">
  <div class="menu-card">
    <div class="logo">Кубики</div>
    <p class="menu-note">Собери столбик одного цвета — и в городе вырастет дом.</p>
    <button class="primary" id="btn-play" type="button">Играть</button>
    <div class="menu-row">
      <span id="menu-level">Уровень 1</span>
      <button class="link" id="btn-menu-settings" type="button">Настройки</button>
    </div>
  </div>
</div>

<div id="screen-win" class="screen hidden">
  <div class="menu-card">
    <div class="win-title">Уровень пройден</div>
    <div class="stars" id="win-stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="win-stats" id="win-stats">Ходов: 0</div>
    <div class="win-city" id="win-city">В городе прибавилось домов: 0</div>
    <button class="primary" id="btn-next" type="button">Далее</button>
  </div>
</div>

<div id="screen-settings" class="screen hidden">
  <div class="menu-card">
    <div class="win-title">Настройки</div>
    <button class="toggle" id="btn-restart" type="button">Начать уровень заново<span class="toggle-state">⟳</span></button>
    <button class="toggle" id="btn-sound" type="button">Звук<span class="toggle-state" id="sound-state">вкл</span></button>
    <button class="toggle" id="btn-vibro" type="button">Вибрация<span class="toggle-state" id="vibro-state">вкл</span></button>
    <button class="toggle danger" id="btn-reset" type="button">Сбросить прогресс</button>
    <button class="primary" id="btn-close-settings" type="button">Закрыть</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
