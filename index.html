<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2EADA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кубоград">
<title>Кубоград</title>
<!-- Инлайновый SVG-фавикон: без бинарного ассета и без запроса favicon.ico,
     иначе браузер тянет его сам и роняет 404 в консоль. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F2EADA'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='%239A7B52'/%3E%3Cpath d='M16 5l9 5-9 5-9-5z' fill='%23C0A277'/%3E%3Cpath d='M16 15l9-5v12l-9 5z' fill='%237E6242'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- SDK площадки — единственный внешний запрос, разрешённый правилом 7.
     Не async и не defer: window.bridge должен существовать к запуску модуля.
     Если скрипт не загрузился, detectAdapter() уходит на заглушку. -->
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <button class="icon-button" id="btn-menu" type="button" data-i18n-aria="hud.menu" aria-label="Меню">‹</button>
    <div class="level-badge">
      <span class="level-caption" data-i18n="hud.level">Уровень</span>
      <span id="level-number">1</span>
      <span class="level-goal" id="level-goal"></span>
    </div>
    <button class="icon-button" id="btn-settings" type="button" data-i18n-aria="hud.settings" aria-label="Настройки">⚙</button>
  </div>
  <div class="hud-bottom">
    <button class="tool" id="btn-undo" type="button">
      <span class="tool-icon">↺</span><span class="tool-label" data-i18n="hud.undo">Отменить</span><span class="tool-badge" id="undo-badge">3</span>
    </button>
    <button class="tool" id="btn-hint" type="button">
      <span class="tool-icon">?</span><span class="tool-label" data-i18n="hud.hint">Подсказка</span><span class="tool-badge" id="hint-badge">2</span>
    </button>
    <button class="tool" id="btn-post" type="button">
      <span class="tool-icon">+</span><span class="tool-label" data-i18n="hud.post">Столбик</span><span class="tool-badge" id="post-badge">1</span>
    </button>
  </div>
</div>

<div id="screen-loading" class="screen">
  <div class="logo" data-i18n="app.title">Кубоград</div>
  <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
</div>

<div id="screen-menu" class="screen hidden">
  <div class="menu-card">
    <div class="logo" data-i18n="app.title">Кубоград</div>
    <p class="menu-note" data-i18n="menu.note">В каждом режиме свой город</p>
    <div class="modes" id="mode-list">
      <button class="mode-card" id="mode-easy" type="button" data-mode="easy">
        <canvas class="mode-city" id="mode-city-easy" width="600" height="144"></canvas>
        <span class="mode-title"><span data-i18n="mode.easy.title">Лёгкий</span><i class="mode-medal hidden" id="mode-medal-easy"></i></span>
        <span class="mode-progress" id="mode-progress-easy"></span>
      </button>
      <button class="mode-card" id="mode-normal" type="button" data-mode="normal">
        <canvas class="mode-city" id="mode-city-normal" width="600" height="144"></canvas>
        <span class="mode-title"><span data-i18n="mode.normal.title">Средний</span><i class="mode-medal hidden" id="mode-medal-normal"></i></span>
        <span class="mode-progress" id="mode-progress-normal"></span>
      </button>
      <button class="mode-card" id="mode-hard" type="button" data-mode="hard">
        <canvas class="mode-city" id="mode-city-hard" width="600" height="144"></canvas>
        <span class="mode-title"><span data-i18n="mode.hard.title">Сложный</span><i class="mode-medal hidden" id="mode-medal-hard"></i></span>
        <span class="mode-progress" id="mode-progress-hard"></span>
      </button>
    </div>
    <div class="menu-row menu-row-end">
      <button class="link" id="btn-menu-settings" type="button" data-i18n="menu.settings">Настройки</button>
    </div>
  </div>
</div>

<div id="screen-win" class="screen hidden">
  <div class="menu-card">
    <div class="win-title" data-i18n="result.title">Уровень пройден</div>
    <div class="win-stats" id="win-stats"></div>
    <div class="win-city" id="win-city"></div>
    <button class="primary" id="btn-next" type="button" data-i18n="result.next">Далее</button>
  </div>
</div>

<div id="screen-settings" class="screen hidden">
  <div class="menu-card">
    <div class="win-title" data-i18n="settings.title">Настройки</div>
    <button class="toggle" id="btn-restart" type="button"><span data-i18n="settings.restart">Начать уровень заново</span><span class="toggle-state">⟳</span></button>
    <button class="toggle" id="btn-sound" type="button"><span data-i18n="settings.sound">Звук</span><span class="toggle-state" id="sound-state">вкл</span></button>
    <button class="toggle" id="btn-vibro" type="button"><span data-i18n="settings.vibro">Вибрация</span><span class="toggle-state" id="vibro-state">вкл</span></button>
    <div class="toggle toggle-static">
      <span data-i18n="settings.language">Язык</span>
      <span class="lang-switch">
        <button class="lang-option" id="btn-lang-ru" type="button" data-lang="ru">RU</button>
        <button class="lang-option" id="btn-lang-en" type="button" data-lang="en">EN</button>
      </span>
    </div>
    <button class="toggle danger" id="btn-reset" type="button" data-i18n="settings.reset">Сбросить прогресс</button>
    <button class="primary" id="btn-close-settings" type="button" data-i18n="settings.close">Закрыть</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
