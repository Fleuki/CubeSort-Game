:root {
  --bg-top: #F2EADA;
  --table: #DFD0B4;
  --wood: #9A7B52;
  --ink: #2E2A24;
  --shadow: rgba(92, 70, 44, 0.20);
  --card: #FBF6EC;
  /* Геометрия портретной рамки: на телефоне — во всю ширину, на десктопе
     JS сужает и центрирует. */
  --stage-w: 100%;
  --stage-left: 0px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* position: fixed + inset убивают инерционный скролл iOS и pull-to-refresh —
     без этого модерация Яндекса заворачивает за «браузерную прокрутку» (§1.10.2). */
  position: fixed;
  inset: 0;
  background: var(--bg-top);
  color: var(--ink);
  font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-weight: 500;
  overscroll-behavior: none;
  touch-action: none;
}

#scene {
  position: fixed;
  top: 0;
  left: 0;
  display: block;
  touch-action: none;
}

.hidden { display: none !important; }

.hud {
  position: fixed;
  top: 0;
  bottom: 0;
  /* Привязка к портретной рамке: кнопки идут по краям поля, а не окна. */
  left: var(--stage-left);
  width: var(--stage-w);
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
}

.hud-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.hud-bottom {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.icon-button {
  pointer-events: auto;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.55);
  color: var(--ink);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--shadow);
}

.level-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Unbounded', 'Onest', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.02em;
}

.level-caption {
  font-family: 'Onest', sans-serif;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.55;
}

/* Строка с ходами не спорит с полем за внимание: мелкий кегль,
   тот же тон, что у номера уровня. */
.level-goal {
  font-family: 'Onest', sans-serif;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.01em;
  opacity: 0.55;
  white-space: nowrap;
}

.tool {
  pointer-events: auto;
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  max-width: 116px;
  min-height: 48px;
  padding: 8px 6px 6px;
  border: none;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.62);
  color: var(--ink);
  font-family: inherit;
  font-weight: 600;
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--shadow);
  transition: transform 0.09s ease;
}

.tool:active { transform: translateY(2px); box-shadow: none; }
.tool[disabled] { opacity: 0.42; }

.tool-icon { display: block; font-size: 18px; line-height: 1.1; }
.tool-label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tool-badge {
  position: absolute;
  top: 4px;
  right: 6px;
  min-width: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--wood);
  color: #FBF6EC;
  font-size: 10px;
  line-height: 16px;
}

.tool-badge.reward { background: #D4553F; }

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(242, 234, 218, 0.62);
  backdrop-filter: blur(1px);
  z-index: 5;
}

.logo {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: clamp(30px, 11vw, 46px);
  letter-spacing: 0.01em;
  margin-bottom: 14px;
}

.progress {
  width: min(240px, 70vw);
  height: 8px;
  border-radius: 4px;
  background: rgba(154, 123, 82, 0.25);
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: var(--wood);
  transition: width 0.2s ease;
}

#screen-loading { flex-direction: column; }

/* Карточка победы стоит внизу: игрок должен увидеть, что прибавилось в городе. */
#screen-win { align-items: flex-end; padding-bottom: max(24px, env(safe-area-inset-bottom)); }

.menu-card {
  width: min(340px, 100%);
  padding: 26px 22px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: 0 10px 0 var(--shadow);
  text-align: center;
}

.menu-note {
  margin: 0 0 14px;
  font-size: 14px;
  line-height: 1.45;
  opacity: 0.72;
}

.primary {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 18px;
  background: var(--wood);
  color: #FBF6EC;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 4px 0 #7E6242;
}

.primary:active { transform: translateY(3px); box-shadow: none; }

/* Карточки режимов: три спокойных плитки, ни одна не спорит с соседней. */
.modes {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.mode-card {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-areas: 'city' 'title' 'progress';
  align-items: center;
  gap: 2px 10px;
  width: 100%;
  padding: 10px 12px 12px;
  border: none;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.5);
  box-shadow: 0 3px 0 rgba(154, 123, 82, 0.28);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.mode-card:active { transform: translateY(2px); box-shadow: none; }

.mode-city {
  grid-area: city;
  width: 100%;
  height: 72px;
  margin-bottom: 6px;
  border-radius: 12px;
  background: rgba(223, 208, 180, 0.5);
}

.mode-title {
  grid-area: title;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 16px;
}

/* Медаль — кружок в цвет металла рядом с названием режима. */
.mode-medal {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-left: 8px;
  border-radius: 50%;
  vertical-align: middle;
  box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.18);
}

.mode-progress {
  grid-area: progress;
  font-size: 12px;
  opacity: 0.7;
}

.menu-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 13px;
  opacity: 0.75;
}

.menu-row-end { justify-content: flex-end; }

.link {
  border: none;
  background: none;
  color: var(--ink);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}

.win-title {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 22px;
  margin-bottom: 10px;
}


.win-stats { font-size: 14px; opacity: 0.7; }
.win-city { font-size: 13px; opacity: 0.62; margin: 6px 0 18px; }

.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 10px;
  padding: 13px 16px;
  border: none;
  border-radius: 16px;
  background: rgba(154, 123, 82, 0.14);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}

.toggle-state { opacity: 0.6; font-weight: 500; }
.toggle.danger { color: #B5432F; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 22%;
  transform: translateX(-50%);
  padding: 10px 16px;
  border-radius: 14px;
  background: rgba(46, 42, 36, 0.88);
  color: #FBF6EC;
  font-size: 13px;
  z-index: 8;
  pointer-events: none;
}

@media (max-height: 620px) {
  .menu-card { padding: 18px 16px; }
  .mode-city { height: 60px; }
  .mode-title { font-size: 15px; }
  .tool { font-size: 10px; padding: 6px 4px 5px; }
}

/* Переключатель языка живёт в строке настроек: сама строка не кнопка,
   кликаются только RU и EN. */
.toggle-static { cursor: default; }

.lang-switch { display: flex; gap: 6px; }

.lang-option {
  min-width: 40px;
  padding: 5px 10px;
  border: none;
  border-radius: 10px;
  background: rgba(154, 123, 82, 0.18);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  font-size: 13px;
  opacity: 0.6;
  cursor: pointer;
}

.lang-option.active {
  background: var(--wood);
  color: #FBF6EC;
  opacity: 1;
}

  let placed = 0;
  for (let level = 0; level < passed; level += 1) {
    // Порядок тот же, что в игре: сначала декорации за столбики уровня,
    // потом дом за сам уровень.
    const want = Math.round((level + 1) * perLevel);
    while (placed < want) {
      commitReward(city, prepareReward(city, 0, level, false));
      placed += 1;
    }
    syncCamera(city);
    commitReward(city, prepareReward(city, migratedColor(level), level, true));
  }
  const districts = Math.floor(city.buildings.length / DISTRICT_SIZE);
  for (let i = 0; i < city.buildings.length; i += 1) {
    city.buildings[i].lit = city.buildings[i].district < districts;
  }
  syncCamera(city);
  touch(city);
}

// Снимок для отмены хода: меняться могут постройки, декорации,
// этажность, свет и ступень камеры.
function snapshotCity(city) {
  return {
    stage: city.stage,
    seq: city.seq,
    buildings: city.buildings.slice(),
    props: city.props.slice(),
    floors: city.buildings.map((building) => building.floors),
    ranks: city.props.map((prop) => prop.rank),
    lit: city.buildings.map((building) => building.lit)
  };
}

function restoreCity(city, snapshot) {
  if (!snapshot) return;
  city.buildings.length = 0;
  for (let i = 0; i < snapshot.buildings.length; i += 1) {
    const building = snapshot.buildings[i];
    building.floors = snapshot.floors[i];
    building.lit = snapshot.lit[i];
    city.buildings.push(building);
  }
  city.props.length = 0;
  for (let i = 0; i < snapshot.props.length; i += 1) {
    const prop = snapshot.props[i];
    prop.rank = snapshot.ranks[i];
    city.props.push(prop);
  }
  city.pendings.length = 0;
  city.seq = snapshot.seq;
  city.stage = snapshot.stage;
  touch(city);
}

// Район считается завершённым каждые DISTRICT_SIZE построек.
function completedDistrict(city) {
  const count = city.buildings.length;
  if (count === 0 || count % DISTRICT_SIZE !== 0) return -1;
  return count / DISTRICT_SIZE - 1;
}

// Ступень камеры: одна на завершённый район, дальше масштаб фиксирован.
function cameraTarget(city) {
  return Math.min(MAX_STAGE, Math.floor(city.buildings.length / DISTRICT_SIZE));
}

function syncCamera(city) {
  city.stage = cameraTarget(city);
}

function setCameraStage(city, stage) {
  city.stage = stage;
  city.dirty = true;
}

// Порядок зажигания окон: волной слева направо.
function lightingOrder(city, rect, district) {
  const geo = geometry(rect, city);
  return city.buildings
    .filter((building) => building.district === district && !building.lit)
    .map((building) => ({ building, x: screenPoint(geo, plotWorld(building.plot, building.seed)).x }))
    .sort((a, b) => a.x - b.x)
    .map((item) => item.building);
}

function lightBuilding(city, building) {
  building.lit = true;
  city.dirty = true;
}

function makeBuilding(order, seq, colorIndex) {
  return {
    index: order,
    seq,
    plot: -1,
    color: colorIndex % PALETTE.length,
    kind: kindFor(order),
    floors: 1,
    district: Math.floor(order / DISTRICT_SIZE),
    lit: false,
    seed: hash(order)
  };
}

function kindFor(order) {
  const number = order + 1;
  if (LANDMARK_AT.indexOf(number) >= 0) return 'landmark';
  if (number <= HOUSE1_UNTIL) return 'house1';
  if (number <= HOUSE2_UNTIL) return 'house2';
  if (number <= BLOCK3_UNTIL) return 'block3';
  return 'block4';
}

// Перемешивание битов, а не просто умножение: у мультипликативного
// хеша младшие биты повторяются, и все дома выходили одного цвета.
function hash(value) {
  let x = (value + 1) >>> 0;
  x = Math.imul(x ^ (x >>> 16), 2246822507) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 3266489909) >>> 0;
  return (x ^ (x >>> 16)) >>> 0;
}

// Цвета пересобранного города: соседние номера не повторяются,
// и каждая семёрка сдвинута относительно предыдущей.
function migratedColor(order) {
  return (order * 3 + Math.floor(order / PALETTE.length)) % PALETTE.length;
}

// Сколько этажей город уже надстроил: часть seed выбора здания.
function addedFloors(city) {
  let total = 0;
  for (let i = 0; i < city.buildings.length; i += 1) total += city.buildings[i].floors - 1;
  for (let i = 0; i < city.pendings.length; i += 1) {
    const pending = city.pendings[i];
    if (pending.upgrade && pending.building) total += 1;
  }
  return total;
}

// Детерминированно «случайное» здание: от номера уровня и числа уже
// выданных этажей, а не от Math.random, иначе после отмены хода этаж
// уедет другому дому.
// Стопка выше MAX_CUBES не растёт — ищем следующую подходящую.
function pickUpgrade(city, level) {
  const count = city.buildings.length;
  if (count === 0) return null;
  // Seed меняется с каждым выданным этажом, иначе все столбики уровня
  // уходили в один и тот же дом и он один вырастал в башню.
  const start = hash(level * 1000 + addedFloors(city)) % count;
  for (let i = 0; i < count; i += 1) {
    const building = city.buildings[(start + i) % count];
    if (buildingCubes(building.kind, building.floors + 1) > buildingCubes(building.kind, building.floors)) {
      return building;
    }
  }
  return null;
}

// --- раскладка ------------------------------------------------------------

// Номер участка, с которого начинается поиск места. Дома и озеленение
// расходятся по разным номерам, чтобы не толкаться с первой попытки,
// но занятость решает реестр, а не эта нумерация.
function plotOfBuilding(order) {
  return order + Math.floor(order / (PROP_EVERY - 1));
}

function plotOfProp(slot) {
  return slot * PROP_EVERY + PROP_EVERY - 1;
}

// Фонарь вместо дерева на каждом LAMP_EVERY-м участке: город должен
// быть не только зелёным.
function isLampSlot(slot) {
  return hash(slot + 4099) % LAMP_EVERY === 0;
}

// Фонарь стадий не имеет: он ставится сразу фонарём и целью апгрейда
// не бывает никогда. Расти умеют только куст и малое дерево.
function propKind(slot, rank) {
  if (isLampSlot(slot)) return 'lamp';
  if (rank <= 0) return 'bush';
  return rank === 1 ? 'treeSmall' : 'treeLarge';
}


function propRadius(kind) {
  return propWidthUnits(kind) / 2;
}

const BUILDING_RADIUS = CUBE_WIDTH_UNITS / 2;

// Сколько построек должно поместиться на площадке при данной ступени
// камеры. Значение непрерывное: во время отъезда камеры ступень дробная.
function slotsForStage(stage) {
  return Math.min(MAX_BUILDINGS, DISTRICT_SIZE * (stage + 1));
}

// Участков больше, чем построек: часть отдана озеленению, плюс запас
// на поиск. Без запаса первый же пропущенный участок выталкивал дом
// за площадку, дом не вставал, ступень камеры не росла — и город
// застревал навсегда.
function plotsForStage(stage) {
  return (slotsForStage(stage) * PROP_EVERY * PLOT_SLACK) / (PROP_EVERY - 1);
}

// Радиус площадки в CITY_UNIT — им ограничен и поиск участка,
// и сам овал: за ограду объекты не выходят.
function plateRadiusUnits(stage) {
  return STEP_UNITS * Math.sqrt(Math.max(1, plotsForStage(stage) - 1)) + EDGE_UNITS;
}

// Мест под озеленение столько же, сколько было до запаса: запас нужен
// поиску, а не декорациям.
function propSlotCount(stage) {
  return Math.floor(slotsForStage(Math.max(0, Math.min(MAX_STAGE, stage))) / (PROP_EVERY - 1));
}

// Филлотаксис: угол по золотому сечению, радиус по корню номера.
// Мировые координаты от масштаба и экрана не зависят — раскладка
// одинакова при любом размере окна и в любом запуске.
function plotWorld(plot, seed) {
  const angle = plot * GOLDEN_ANGLE;
  const radius = STEP_UNITS * Math.sqrt(Math.max(0, plot));
  const shift = jitterOf(seed);
  return {
    u: Math.cos(angle) * radius + shift.jx * STEP_UNITS,
    v: Math.sin(angle) * radius + shift.jy * STEP_UNITS
  };
}

function jitterOf(seed) {
  const a = ((seed >>> 3) % 1000) / 1000 - 0.5;
  const b = ((seed >>> 13) % 1000) / 1000 - 0.5;
  return { jx: a * 2 * JITTER, jy: b * 2 * JITTER };
}

// Единый реестр занятых точек: и дома, и деревья, и фонари, и кусты.
// Пересчитывается только при изменении набора объектов.
function placesOf(city) {
  if (city.places && city.placesVersion === city.version) return city.places;
  const places = [];
  const all = city.buildings.concat(city.props);
  for (let i = 0; i < city.pendings.length; i += 1) {
    const pending = city.pendings[i];
    if (pending.upgrade) continue;
    all.push(pending.prop || pending.building);
  }
  all.sort((a, b) => a.seq - b.seq);
  // Памятник стоит в самом центре и участвует в реестре наравне со всеми.
  if (city.monument) {
    places.push({ item: city.monument, u: 0, v: 0, r: MONUMENT_RADIUS, h: MONUMENT_HEIGHT });
  }
  for (let i = 0; i < all.length; i += 1) {
    const item = all[i];
    if (item.plot < 0) continue;
    const point = plotWorld(item.plot, item.seed);
    places.push({ item, u: point.u, v: point.v, r: radiusOf(item), h: heightOf(item) });
  }
  city.places = places;
  city.placesVersion = city.version;
  return places;
}

function isProp(item) {
  return item.rank !== undefined;
}

function radiusOf(item) {
  if (item.medal) return MONUMENT_RADIUS;
  return isProp(item) ? propRadius(propKind(item.slot, item.rank)) : BUILDING_RADIUS;
}

function heightOf(item) {
  if (item.medal) return MONUMENT_HEIGHT;
  return isProp(item)
    ? propHeightUnits(propKind(item.slot, item.rank))
    : buildingHeightUnits(item.kind, item.floors);
}

// Точка свободна, если до каждого соседа есть зазор по основаниям
// и пара не стоит одна перед другой вплотную по глубине.
function fits(places, point, radius, height, ignore) {
  for (let i = 0; i < places.length; i += 1) {
    const place = places[i];
    if (place.item === ignore) continue;
    const du = Math.abs(point.u - place.u);
    const dv = Math.abs(point.v - place.v);
    if (Math.hypot(du, dv) < radius + place.r + MIN_GAP) return false;
    if (du < radius + place.r && dv < DEPTH_CLEAR * Math.max(height, place.h)) return false;
  }
  return true;
}

// Поиск свободного участка для нового объекта: до PLACE_ATTEMPTS попыток
// по участкам своего класса, дальше площадка считается полной.
function findPlot(city, item, attempts = PLACE_ATTEMPTS) {
  const places = placesOf(city);
  const radius = radiusOf(item);
  const height = heightOf(item);
  const limit = plateRadiusUnits(city.stage) - MIN_GAP;
  let plot = isProp(item) ? plotOfProp(item.slot) : plotOfBuilding(item.index);
  for (let attempt = 0; attempt < attempts; attempt += 1) {
    const point = plotWorld(plot, item.seed);
    // За ограду выходить нельзя: это уже не площадка.
    if (Math.hypot(point.u, point.v) + radius <= limit && fits(places, point, radius, height, item)) {
      return plot;
    }
    plot += 1;
  }
  return -1;
}

const tallestCache = new Map();

// Самая высокая постройка среди номеров 1..slots — по ней считается,
// сколько места нужно над дальним краем площадки.
function tallestUpTo(slots) {
  const cached = tallestCache.get(slots);
  if (cached !== undefined) return cached;
  let tallest = 0;
  for (let order = 0; order < slots; order += 1) {
    tallest = Math.max(tallest, buildingHeightUnits(kindFor(order), 1));
  }
  // Надстроенные этажи упираются в MAX_CUBES — их тоже надо уместить.
  if (slots >= MAX_BUILDINGS) tallest = Math.max(tallest, MAX_CUBES + SLAB_HEIGHT);
  tallestCache.set(slots, tallest);
  return tallest;
}

function tallestUnits(stage) {
  const slots = slotsForStage(stage);
  const low = Math.floor(slots);
  const high = Math.ceil(slots);
  const a = tallestUpTo(low);
  return a + (tallestUpTo(high) - a) * (slots - low);
}

// Геометрия площадки. Единица масштаба — CITY_UNIT, высота городского
// кубика: она уменьшается ступенями камеры, а овал считается от неё
// и от фактического размера зоны, чтобы никогда не обрезаться.
function geometry(rect, city) {
  const stage = Math.max(0, Math.min(MAX_STAGE, city.stage));
  const plots = plotsForStage(stage);
  const radiusUnits = plateRadiusUnits(stage);
  const tallest = tallestUnits(stage);
  const above = rect.height * PLATE_CENTER_Y - PLATE_MARGIN;
  const below = rect.height * (1 - PLATE_CENTER_Y) - PLATE_MARGIN;
  const byZoom = ((rect.height * START_HOUSE_SHARE) / (1 + GABLE_RISE)) * Math.pow(ZOOM_STEP, stage);
  const byWidth = (rect.width / 2 - PLATE_MARGIN) / radiusUnits;
  const byTop = above / (radiusUnits * MIN_PLATE_ASPECT + tallest);
  const byBottom = below / (radiusUnits * MIN_PLATE_ASPECT);
  const unit = Math.max(1, Math.min(byZoom, byWidth, byTop, byBottom));
  const rx = radiusUnits * unit;
  const ry = Math.min(rx * PLATE_ASPECT, above - tallest * unit, below);
  return {
    x: rect.x + rect.width / 2,
    y: rect.y + rect.height * PLATE_CENTER_Y,
    rx,
    ry,
    aspect: ry / rx,
    unit,
    plots
  };
}

// Мировая точка на экране. Единственное место перевода координат:
// траектория полёта награды считает её каждый кадр, поэтому масштаб
// и ступень камеры могут меняться прямо во время полёта.
function screenPoint(geo, point) {
  return { x: geo.x + point.u * geo.unit, y: geo.y + point.v * geo.unit * geo.aspect, unit: geo.unit };
}

// Куда летит награда: точка касания земли в городе и масштаб на месте.
function rewardPoint(rect, city, pending) {
  const geo = geometry(rect, city);
  if (!pending) return { x: geo.x, y: geo.y, unit: geo.unit };
  const item = pending.prop || pending.building;
  if (!item || item.plot < 0) return { x: geo.x, y: geo.y, unit: geo.unit };
  return screenPoint(geo, plotWorld(item.plot, item.seed));
}

// --- запечённый макет -----------------------------------------------------

// Отдельный offscreen: макет перерисовывается при изменении, а не каждый кадр.
function getCityCanvas(city, rect) {
  if (!city.canvas) {
    city.canvas = document.createElement('canvas');
    city.ctx = city.canvas.getContext('2d');
    city.dirty = true;
  }
  const w = Math.max(1, Math.round(rect.width));
  const h = Math.max(1, Math.round(rect.height));
  if (city.canvas.width !== w || city.canvas.height !== h) {
    city.canvas.width = w;
    city.canvas.height = h;
    city.dirty = true;
  }
  if (city.dirty) {
    const local = { x: 0, y: 0, width: w, height: h };
    const geo = geometry(local, city);
    city.ctx.clearRect(0, 0, w, h);
    drawGround(city.ctx, geo, city);
    const items = sceneItems(geo, city);
    for (let i = 0; i < items.length; i += 1) paintItem(city.ctx, items[i], materialOf(city), city.monumentRise);
    city.dirty = false;
  }
  return city.canvas;
}

// Награда в момент приземления: рисуется поверх запечённого макета
// со сплющиванием по вертикали — это её отскок.
function drawReward(ctx, rect, city, pending, squash) {
  if (!pending) return;
  const point = rewardPoint(rect, city, pending);
  ctx.save();
  ctx.beginPath();
  ctx.rect(rect.x, rect.y, rect.width, rect.height);
  ctx.clip();
  paintReward(ctx, pending, point.x, point.y, point.unit, squash, materialOf(city));
  ctx.restore();
}

// Награда в полёте: та же деталь, только с поворотом и своим масштабом.
function drawRewardAt(ctx, city, pending, x, y, unit, angle) {
  if (!pending) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.translate(-x, -y);
  paintReward(ctx, pending, x, y, unit, 1, materialOf(city));
  ctx.restore();
}

// Лёгкая волна по площадке от места приземления.
function drawRipple(ctx, rect, city, ripple) {
  const geo = geometry(rect, city);
  const warm = Boolean(ripple.warm);
  const radius = warm
    ? geo.rx * ripple.t
    : geo.unit * CUBE_WIDTH_UNITS * (RIPPLE_FROM + (RIPPLE_TO - RIPPLE_FROM) * ripple.t);
  const x = warm ? geo.x : ripple.x;
  const y = warm ? geo.y : ripple.y;
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(geo.x, geo.y, geo.rx, geo.ry, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.globalAlpha = (warm ? MONUMENT_GLOW_ALPHA : RIPPLE_ALPHA) * (1 - ripple.t);
  ctx.strokeStyle = warm ? MONUMENT_GLOW : '#FFFFFF';
  ctx.lineWidth = Math.max(1, geo.unit * (warm ? 0.5 : 0.12));
  ctx.beginPath();
  ctx.ellipse(x, y, radius, radius * geo.aspect, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// Все объекты макета в одном списке и с явной точкой касания земли:
// глубина считается по основанию, иначе высокий дом «перекрывает»
// дерево, которое стоит ближе к зрителю. Награда в полёте своего места
// в макете ещё не занимает — её рисует сцена.
function sceneItems(geo, city) {
  const places = placesOf(city);
  const items = [];
  for (let i = 0; i < places.length; i += 1) {
    const place = places[i];
    if (isPending(city, place.item)) continue;
    items.push({ item: place.item, point: screenPoint(geo, place) });
  }
  items.sort((a, b) => a.point.y - b.point.y);
  return items;
}

function isPending(city, item) {
  for (let i = 0; i < city.pendings.length; i += 1) {
    const pending = city.pendings[i];
    if (!pending.upgrade && (pending.prop === item || pending.building === item)) return true;
  }
  return false;
}

function paintItem(ctx, entry, material, rise) {
  const item = entry.item;
  const point = entry.point;
  if (item.medal) paintMonument(ctx, item, point.x, point.y, point.unit, material, rise);
  else if (isProp(item)) paintProp(ctx, propKind(item.slot, item.rank), point.x, point.y, point.unit, item.seed, material);
  else paintBuilding(ctx, item, point.x, point.y, point.unit, item.floors, material);
}

// Памятник: постамент и обелиск из трёх сужающихся кубиков в цвет
// медали. Отделка — материала режима, как у зданий.
function paintMonument(ctx, monument, x, groundY, unit, material, rise) {
  const style = blockStyle(material, monument.color, false);
  const half = cubeHalf(unit);
  const hidden = (1 - rise) * MONUMENT_HEIGHT * unit;
  drawShadow(ctx, x, groundY, MONUMENT_HEIGHT * unit, half * 2 * SHADOW_SPREAD, rise);
  // Тёплый ореол: без него памятник теряется среди шестикубовых башен.
  if (rise > 0) glow(ctx, x, groundY - MONUMENT_HEIGHT * unit * 0.5 * rise, half * MONUMENT_GLOW_SPREAD, MONUMENT_HEIGHT * unit);
  ctx.save();
  ctx.beginPath();
  // Выезд снизу: над землёй видна только успевшая подняться часть.
  ctx.rect(x - half * 3, groundY - MONUMENT_HEIGHT * unit * 2, half * 6, MONUMENT_HEIGHT * unit * 2 + half);
  ctx.clip();
  let level = groundY + hidden;
  level = stackBlock(ctx, x, level, half * MONUMENT_PEDESTAL.width, MONUMENT_PEDESTAL.height * unit, monument.color, false, style);
  let top = half;
  for (let i = 0; i < MONUMENT_STEPS.length; i += 1) {
    const step = MONUMENT_STEPS[i];
    top = half * step.width;
    level = stackBlock(ctx, x, level, top, step.height * unit, monument.color, i === MONUMENT_STEPS.length - 1, style);
  }
  monumentFinial(ctx, material, x, level, top, unit, monument.color, style);
  ctx.restore();
}

// Навершие в цвет медали: дерево — флажок на древке, камень — шар,
// стекло — шпиль с антенной.
function monumentFinial(ctx, material, x, topY, half, unit, color, style) {
  const outline = style && style.outline ? style.outline : shade(color, -OUTLINE_DARK);
  ctx.strokeStyle = outline;
  ctx.lineWidth = OUTLINE_WIDTH;
  ctx.lineJoin = 'round';
  if (material === 'stone') {
    const radius = FINIAL_BALL * unit;
    ctx.fillStyle = shade(color, 0.14);
    ctx.beginPath();
    ctx.arc(x, topY - radius, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Блик снизу слева: без него шар читается плоским кругом.
    ctx.fillStyle = shade(color, -0.2);
    ctx.beginPath();
    ctx.arc(x, topY - radius, radius, Math.PI * 0.15, Math.PI * 0.85);
    ctx.fill();
    ctx.stroke();
    return;
  }
  if (material === 'glass') {
    const apex = topY - FINIAL_SPIRE * unit;
    const w = half * 0.55;
    triangle(ctx, x - w, topY, x, topY + w * 0.5, x, apex, shade(color, -0.14));

  spawnSplinters(app.fx, end.x, end.y, PALETTE[color % PALETTE.length]);
  sfx.playPlace();
  vibrate(VIBRO_PLACE);
  updateHud();

  if (isPostComplete(app.state.posts[to], app.state.capacity)) {
    // Дом даётся за пройденный уровень: если этот столбик его закрывает,
    // в город летит дом, иначе — декорация.
    completePost(to, color, isSolved(app.state.posts, app.state.capacity));
    return;
  }
  checkWin();
}

// Эффекты снимаются из своих списков по ссылке: за время анимации
// список мог поменяться.
function drop(list, effect) {
  const at = list.indexOf(effect);
  if (at >= 0) list.splice(at, 1);
}

function clearEffects() {
  cancelRewards();
  app.landings.length = 0;
  app.waves.length = 0;
  app.bursts.length = 0;
  app.caps.length = 0;
  app.ripples.length = 0;
}

// Отмена хода и смена уровня снимают награды с полёта: то, что уже
// зачтено, коммитится отдельно, остальное не должно долететь.
function cancelRewards() {
  for (let i = 0; i < app.rewards.length; i += 1) app.rewards[i].cancelled = true;
  for (let i = 0; i < app.drops.length; i += 1) app.drops[i].cancelled = true;
  app.rewards.length = 0;
  app.drops.length = 0;
}

function completePost(index, color, solving) {
  const capacity = app.state.capacity;
  sfx.playComplete();
  vibrate(VIBRO_COMPLETE);

  // 0 мс — волна подпрыгивания снизу вверх.
  const wave = { post: index, t: 0 };
  app.waves.push(wave);
  addTween(app.tweens, {
    duration: WAVE_STEP_MS * (capacity + WAVE_HOP_STEPS),
    onUpdate: (t) => {
      wave.t = t * (capacity + WAVE_HOP_STEPS);
    },
    onDone: () => {
      drop(app.waves, wave);
    }
  });

  // +180 мс — вспышка-кольцо от основания стопки наружу.
  const burst = { post: index, t: 0 };
  addTween(app.tweens, {
    delay: BURST_AT_MS,
    duration: BURST_MS,
    onStart: () => {
      app.bursts.push(burst);
    },
    onUpdate: (t) => {
      burst.t = t;
    },
    onDone: () => {
      drop(app.bursts, burst);
    }
  });

  // +220 мс — крышка падает сверху и садится с отскоком.
  // Крышка занимает место сразу: до её падения у столбика не рисуется
  // ни выступ, ни она сама.
  const cap = { post: index, hidden: true, lift: 1, squash: 1 };
  app.caps.push(cap);
  addTween(app.tweens, {
    delay: CAP_AT_MS,
    duration: CAP_MS,
    easing: EASING.easeOutBack,
    onStart: () => {
      cap.hidden = false;
    },
    onUpdate: (t) => {
      cap.lift = 1 - t;
    },
    onDone: () => settleCap(cap)
  });

  // +240 мс — щепки и тряска камеры.
  addTween(app.tweens, {
    delay: SPARK_AT_MS,
    duration: SHAKE_AT_MS - SPARK_AT_MS + 1,
    onStart: () => {
      if (app.fx.reducedMotion) return;
      const top = slotPosition(app.layout, index, capacity - 1);
      spawnSplinters(app.fx, app.layout.posts[index].x, top.y, PALETTE[color % PALETTE.length], SPARK_COUNT, SPARK_LIFE_MS);
      shakeCamera(app.fx);
    }
  });

  // +300 мс — награда вылетает из стопки и летит в город.
  const pending = prepareReward(app.city, color, app.level, solving);
  if (!pending) return;
  const reward = { pending, post: index, flying: false, x: 0, y: 0, unit: 1, angle: 0 };
  addTween(app.tweens, {
    delay: REWARD_AT_MS,
    duration: REWARD_FLIGHT_MS,
    easing: EASING.easeInOutQuad,
    onStart: () => {
      app.rewards.push(reward);
      reward.flying = true;
    },
    onUpdate: (t) => flyReward(reward, capacity, t),
    onDone: () => {
      if (reward.cancelled) return;
      landReward(reward, !pending.prop);
    }
  });
}

// Координаты пересчитываются каждый кадр: и точка вылета на поле,
// и точка приземления в городе живут в разных системах, а масштаб
// города может измениться прямо во время полёта.
function flyReward(reward, capacity, t) {
  const layout = app.layout;
  const post = layout.posts[reward.post];
  if (!post) return;
  const from = slotPosition(layout, reward.post, capacity - 1);
  const to = rewardPoint(layout.city, app.city, reward.pending);
  const startUnit = layout.step * post.scale;
  const arc = Math.hypot(to.x - post.x, to.y - from.y) * REWARD_ARC;
  reward.x = post.x + (to.x - post.x) * t;
  // Парабола: дуга поднимается на 40% расстояния до города.
  reward.y = from.y + (to.y - from.y) * t - 4 * arc * t * (1 - t);
  reward.unit = startUnit + (to.unit - startUnit) * t;
  reward.angle = Math.sin(t * Math.PI) * REWARD_SPIN;
}

// Крышка села: щелчок и короткий squash. Дальше её рисует сцена
// по состоянию столбика.
function settleCap(cap) {
  sfx.playCap();
  cap.lift = 0;
  cap.squash = CAP_SQUASH_FROM;
  addTween(app.tweens, {
    duration: CAP_SQUASH_MS,
    easing: EASING.easeOutBack,
    onUpdate: (t) => {
      cap.squash = CAP_SQUASH_FROM + (1 - CAP_SQUASH_FROM) * t;
    },
    onDone: () => {
      drop(app.caps, cap);
    }
  });
}

// +820 мс — награда приземлилась: отскок, волна по площадке, и только
// после этого она попадает в макет.
function landReward(reward, house) {
  const pending = reward.pending;
  sfx.playLand();
  drop(app.rewards, reward);
  const target = rewardPoint(app.layout.city, app.city, pending);
  const ripple = { x: target.x, y: target.y, t: 0 };
  app.ripples.push(ripple);
  addTween(app.tweens, {
    duration: RIPPLE_MS,
    onUpdate: (t) => {
      ripple.t = t;
    },
    onDone: () => {
      drop(app.ripples, ripple);
    }
  });
  const landing = { pending, squash: REWARD_SQUASH_FROM };
  app.drops.push(landing);
  addTween(app.tweens, {
    duration: REWARD_LAND_MS,
    easing: EASING.easeOutBack,
    onUpdate: (t) => {
      landing.squash = REWARD_SQUASH_FROM + (1 - REWARD_SQUASH_FROM) * t;
    },
    onDone: () => {
      drop(app.drops, landing);
      if (landing.cancelled) return;
      commitReward(app.city, pending);
      persist();
      const district = house ? completedDistrict(app.city) : -1;
      if (district >= 0) {
        lightDistrict(district);
        return;
      }
      checkWin();
    }
  });
}

// Район завершён: окна загораются волной слева направо. Свет остаётся
// навсегда, фон при этом не меняется.
function lightDistrict(district) {
  const order = lightingOrder(app.city, app.layout.city, district);
  if (order.length === 0) {
    moveCamera();
    return;
  }
  let lit = 0;
  addTween(app.tweens, {
    duration: WINDOW_STEP_MS * order.length,
    onUpdate: (t) => {
      const target = Math.min(order.length, Math.floor(t * order.length) + 1);
      while (lit < target) {
        lightBuilding(app.city, order[lit]);
        lit += 1;
      }
    },
    onDone: () => {
      while (lit < order.length) {
        lightBuilding(app.city, order[lit]);
        lit += 1;
      }
      persist();
      moveCamera();
    }
  });
}

// Камера отъезжает ступенью — после волны окон, а не вместе с ней:
// плавный отъезд на каждый дом читался бы как убывание города.
function moveCamera() {
  const from = app.city.stage;
  const to = cameraTarget(app.city);
  if (Math.abs(to - from) < 0.001) {
    checkWin();
    return;
  }
  addTween(app.tweens, {
    duration: CAMERA_MS,
    easing: EASING.easeInOutCubic,
    onUpdate: (t) => {
      setCameraStage(app.city, from + (to - from) * t);
    },
    onDone: () => {
      setCameraStage(app.city, to);
      checkWin();
    }
  });
}

// Победа проверяется после каждого хода и после каждой прилетевшей
// награды, но сработать должна ровно один раз.
function checkWin() {
  if (app.winning || app.screen !== 'game' || !app.state) return;
  if (!isSolved(app.state.posts, app.state.capacity)) return;
  // Дом за пройденный уровень ещё летит — экран победы подождёт его.
  if (app.rewards.length > 0 || app.drops.length > 0) return;
  app.winning = true;
  platform.gameplayComplete(levelInfo());
  sfx.playWin();
  app.progress.level = Math.max(app.progress.level, app.level + 1);
  const medal = medalFor(app.mode, app.progress.level);
  app.slots[app.mode].medal = medal;
  // Пройден весь режим — в центре площадки встаёт памятник.
  const raised = medal ? raiseMonument(medal) : false;
  persist();
  addTween(app.tweens, {
    duration: raised ? MONUMENT_RISE_MS + MONUMENT_GLOW_MS : WIN_DELAY_MS,
    onDone: () => {
      app.screen = 'win';
      hud.hide();
      screens.showWin({
        moves: app.state.moves,
        cityCount: app.city.buildings.length
      });
    }
  });
}

// Памятник выезжает снизу, следом по площадке идёт тёплая волна.
// Тряски камеры здесь нет: это спокойный финал, а не удар.
function raiseMonument(medal) {
  if (!grantMonument(app.city, medal, MEDAL_COLORS[medal])) return false;
  monumentRise(app.city, 0);
  addTween(app.tweens, {
    duration: MONUMENT_RISE_MS,
    easing: EASING.easeOutBack,
    onUpdate: (t) => {
      monumentRise(app.city, t);
    },
    onDone: () => {
      monumentRise(app.city, 1);
    }
  });
  const glow = { x: 0, y: 0, t: 0, warm: true };
  addTween(app.tweens, {
    delay: MONUMENT_RISE_MS,
    duration: MONUMENT_GLOW_MS,
    onStart: () => {
      app.ripples.push(glow);
    },
    onUpdate: (t) => {
      glow.t = t;
    },
    onDone: () => {
      drop(app.ripples, glow);
    }
  });
  return true;
}

async function nextLevel() {
  screens.hideAll();
  // Реклама только между уровнями и только когда ничего не анимируется.
  if (platform.canShowInterstitial(app.level)) {
    sfx.setMuted(true);
    await platform.showInterstitial(app.level);
    applyMute();
  }
  app.screen = 'game';
  hud.show();
  fadeTransition(() => startLevel(app.progress.level));
}

function fadeTransition(action) {
  app.busy = true;
  addTween(app.tweens, {
    duration: TRANSITION_MS / 2,
    easing: EASING.easeInOutCubic,
    onUpdate: (t) => {
      app.fade = t;
    },
    onDone: () => {
      action();
      addTween(app.tweens, {
        duration: TRANSITION_MS / 2,
        easing: EASING.easeInOutCubic,
        onUpdate: (t) => {
          app.fade = 1 - t;
        },
        onDone: () => {
          app.fade = 0;
          app.busy = false;
        }
      });
    }
  });
}

// --- помощь ---------------------------------------------------------------

async function requestUndo() {
  if (app.busy || !canUndo(app.history)) return;
  if (app.undoUsed >= modeConfig(app.mode).free.undo && !(await earnReward())) return;
  const snapshot = popHistory(app.history);
  if (!snapshot) return;
  cancelRewards();
  app.state.posts = snapshot.posts;
  app.state.moves = snapshot.moves;
  restoreCity(app.city, snapshot.city);
  app.hand = null;
  app.capAnim = null;
  app.hidden = null;
  app.undoUsed += 1;
  sfx.playTake();
  updateHud();
  persist();
}

async function requestHint() {
  if (app.busy) return;
  // Ищем до оплаты: честный отказ не должен стоить игроку попытки или ролика.
  const move = findHint(app.state.posts, app.state.capacity);
  if (!move) {
    screens.toast(t('toast.hintStuck'));
    return;
  }
  if (app.hintsUsed >= modeConfig(app.mode).free.hint && !(await earnReward())) return;
  app.hand = null;
  app.hint = move;
  app.hintUntil = app.time + HINT_SHOW_MS;
  app.hintsUsed += 1;
  updateHud();
}

async function requestExtraPost() {
  if (app.busy || app.extraPostUsed) return;
  if (!(await earnReward())) return;
  app.state.posts = app.state.posts.map((post) => post.slice());
  app.state.posts.push([]);
  app.extraPostUsed = true;
  app.hand = null;
  clearHistory(app.history);
  rebuildLayout();
  updateHud();
}

async function earnReward() {
  sfx.setMuted(true);
  const rewarded = await platform.showRewarded();
  applyMute();
  if (!rewarded) screens.toast(t('toast.rewardFailed'));
  return rewarded;
}

// --- сохранение -----------------------------------------------------------

// Слот режима собирается из живого состояния, остальные слоты остаются
// как есть: переключение режима не должно задевать чужой прогресс.
function persist() {
  const slot = app.slots[app.mode];
  slot.level = app.progress.level;
  slot.citySchemaVersion = CITY_SCHEMA_VERSION;
  slot.city = app.city.buildings;
  slot.props = app.city.props;
  slot.monument = app.city.monument;
  const data = {};
  data[SETTINGS_KEY] = {
    version: SAVE_VERSION,
    muted: app.settings.muted,
    vibro: app.settings.vibro,
    mode: app.mode
  };
  MODE_IDS.forEach((mode) => {
    data[slotKey(mode)] = app.slots[mode];
  });
  platform.save(data);
}

function slotKey(mode) {
  return `save:v1:${mode}`;
}

// Сколько столбиков собрано за пройденные уровни: по одному на цвет.
function columnsFor(mode, levels) {
  const list = LEVEL_SETS[mode];
  let total = 0;
  for (let i = 0; i < levels; i += 1) {
    total += list[Math.min(i, list.length - 1)].colors;
  }
  return total;
}

async function restore() {
  const data = (await platform.load()) || {};
  const settings = data[SETTINGS_KEY];
  if (settings) {
    app.settings.muted = Boolean(settings.muted);
    app.settings.vibro = settings.vibro !== false;
    if (MODE_IDS.indexOf(settings.mode) >= 0) app.mode = settings.mode;
  } else if (data.level !== undefined) {
    // Сохранение до режимов: настройки общие, прогресс уходит в средний.
    app.settings.muted = Boolean(data.muted);
    app.settings.vibro = data.vibro !== false;
    app.mode = DEFAULT_MODE;
  }
  MODE_IDS.forEach((mode) => {
    app.slots[mode] = readSlot(data, mode);
  });
  MODE_IDS.forEach((mode) => {
    const slot = app.slots[mode];
    const city = createCity([], [], modeConfig(mode).material);
    if (slot.citySchemaVersion === CITY_SCHEMA_VERSION && Array.isArray(slot.city)) {
      loadCity(city, slot.city, Array.isArray(slot.props) ? slot.props : [], slot.monument);
    } else {
      // Город старой схемы пересобирается по актуальным правилам —
      // из числа пройденных уровней и собранных за них столбиков.
      const passed = Math.max(0, slot.level - 1);
      rebuildCity(city, passed, columnsFor(mode, passed));
    }
    // Режим уже пройден — памятник стоит с самого начала, без анимации.
    if (slot.medal && !city.monument) grantMonument(city, slot.medal, MEDAL_COLORS[slot.medal]);
    // Слот держит памятник вместе с городом: иначе он живёт только
    // в памяти и при следующей записи неактивного режима пропадёт.
    slot.monument = city.monument;
    app.cities[mode] = city;
  });
  app.city = app.cities[app.mode];
  app.progress.level = app.slots[app.mode].level;
  applyMute();
}

// Слот режима из сохранения. Прогресс до режимов переносится в средний:
// нынешняя кривая сложности ближе всего к нему.
function readSlot(data, mode) {
  const slot = emptySlot();
  const stored = data[slotKey(mode)];
  const legacy = !data[SETTINGS_KEY] && mode === DEFAULT_MODE && data.level !== undefined ? data : null;
  const source = stored || legacy;
  if (!source) return slot;
  slot.level = Math.max(1, Number(source.level) || 1);
  // Медаль пересчитывается по режиму: звёзд в схеме больше нет.
  slot.medal = medalFor(mode, slot.level);
  slot.citySchemaVersion = source.citySchemaVersion;
  slot.city = Array.isArray(source.city) ? source.city : [];
  slot.props = Array.isArray(source.props) ? source.props : [];
  slot.monument = source.monument || null;
  return slot;
}

// --- цикл -----------------------------------------------------------------

function frame(now) {
  const dt = skipDelta ? 0 : Math.min(MAX_DELTA, now - app.time || 0);
  skipDelta = false;
  app.time = now;
  if (!app.paused) {
    updateTweens(app.tweens, dt);
    updateFx(app.fx, dt);
    if (app.hand) {
      app.hand.bob = Math.sin((now / BOB_PERIOD) * Math.PI * 2) * BOB_AMPLITUDE;
    }
    if (!app.busy && app.pending.length > 0) onTap(app.pending.shift());
    if (app.hint && now > app.hintUntil) app.hint = null;
    app.hintPulse = 0.5 + 0.5 * Math.sin((now / 700) * Math.PI * 2);
  }
  render();
  debug.update({
    time: now,
    dpr: app.dpr,
    layout: app.layout,
    level: app.level,
    par: app.state ? app.state.parMoves : 0,
    moves: app.state ? app.state.moves : 0
  });
  requestAnimationFrame(frame);
}

// Признак «столбик собран» пересчитывается каждый кадр: массив один
// и тот же, в цикле отрисовки мусора не создаём.
const completed = [];

function updateCompleted() {
  const posts = app.state ? app.state.posts : [];
  completed.length = posts.length;
  for (let i = 0; i < posts.length; i += 1) {
    completed[i] = isPostComplete(posts[i], app.state.capacity);
  }
}

function render() {
  if (!app.layout) return;
  updateCompleted();
  drawScene(ctx, {
    layout: app.layout,
    dpr: app.dpr,
    posts: app.state ? app.state.posts : [],
    capacity: app.state ? app.state.capacity : 0,
    completed,
    caps: app.caps,
    bursts: app.bursts,
    rewards: app.rewards,
    ripples: app.ripples,
    drops: app.drops,
    city: app.city,
    hand: app.hand,
    flight: app.flight,
    hidden: app.hidden,
    landings: app.landings,
    waves: app.waves,
    shake: app.shake,
    deny: app.deny,
    hint: app.hint,
    hintPulse: app.hintPulse,
    fx: app.fx,
    fade: app.fade
  });
}

// --- ввод -----------------------------------------------------------------

// Только pointerdown: touchstart вместе с mousedown дают двойное срабатывание.
canvas.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  sfx.resumeAudio();
  if (!app.layout || app.screen !== 'game') return;
  const rect = canvas.getBoundingClientRect();
  const index = hitTest(app.layout, event.clientX - rect.left, event.clientY - rect.top);
  onTap(index);
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
document.addEventListener('contextmenu', (event) => event.preventDefault());
document.addEventListener('gesturestart', (event) => event.preventDefault());
document.addEventListener('dblclick', (event) => event.preventDefault());
document.addEventListener('selectstart', (event) => event.preventDefault());
document.addEventListener('dragstart', (event) => event.preventDefault());

// Страховка от браузерной прокрутки поверх CSS-фиксации (§1.10.2):
// протяжка пальцем, колесо мыши и «скроллящие» клавиши не должны двигать
// страницу. Игра слушает только pointerdown, поэтому глушить их безопасно.
const SCROLL_KEYS = [' ', 'PageUp', 'PageDown', 'Home', 'End',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
document.addEventListener('touchmove', (event) => event.preventDefault(), { passive: false });
window.addEventListener('wheel', (event) => event.preventDefault(), { passive: false });
window.addEventListener('keydown', (event) => {
  if (SCROLL_KEYS.includes(event.key)) event.preventDefault();
});

document.addEventListener('visibilitychange', () => {
  setPauseReason('hidden', document.hidden);
});
// Потеря фокуса окна тоже паузит звук и цикл (§1.3): вкладка может остаться
// видимой, но неактивной — visibilitychange тогда не срабатывает.
window.addEventListener('blur', () => setPauseReason('blur', true));
window.addEventListener('focus', () => setPauseReason('blur', false));

window.addEventListener('message', (event) => {
  if (event.data === 'game_api_pause') setPauseReason('host', true);
  if (event.data === 'game_api_resume') setPauseReason('host', false);
});

// Паузу просят четверо: вкладка ушла в фон, окно потеряло фокус, площадка
// прислала своё событие, хост — postMessage. Игра стоит, пока держится
// хотя бы одна причина: иначе площадка сняла бы паузу у свёрнутой вкладки.
const pauseReasons = { hidden: false, blur: false, platform: false, host: false };

function setPauseReason(reason, active) {
  pauseReasons[reason] = active;
  const paused = Object.keys(pauseReasons).some((key) => pauseReasons[key]);
  if (paused === app.paused) return;
  app.paused = paused;
  if (paused) {
    sfx.suspendAudio();
  } else {
    sfx.resumeAudio();
    // Пока игра стояла, requestAnimationFrame мог не вызываться вовсе.
    // Первый кадр после возобновления идёт с нулевой дельтой, иначе
    // твины прыгнут вперёд на весь накопленный простой.
    skipDelta = true;
  }
}

// --- старт ----------------------------------------------------------------

async function boot() {
  screens.setProgress(0.1);
  resize();
  screens.setProgress(0.35);
  await platform.initPlatform();
  platform.onAudioState((enabled) => {
    platformAudio = enabled;
    applyMute();
  });
  platform.onPauseState((paused) => setPauseReason('platform', paused));
  // Язык определяем до первого показа UI (§2.14): выбор игрока, затем язык
  // площадки, затем язык браузера.
  initLanguage(platform.language());
  screens.setProgress(0.6);
  await restore();
  sfx.initAudio();
  screens.setProgress(0.85);
  if (document.fonts && document.fonts.ready) {
    try {
      await document.fonts.ready;
    } catch (error) {
      // Шрифты не критичны — играем системными.
    }
  }
  screens.setProgress(1);
  requestAnimationFrame(frame);
  // LoadingAPI.ready() — ровно один раз, после первого отрисованного кадра.
  requestAnimationFrame(() => {
    platform.ready();
    openMenu();
  });
}

boot();

return {  };
})();
</script>
