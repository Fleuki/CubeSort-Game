:root {
  --bg-top: #F2EADA;
  --table: #DFD0B4;
  --wood: #9A7B52;
  --ink: #2E2A24;
  --shadow: rgba(92, 70, 44, 0.20);
  --card: #FBF6EC;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg-top);
  color: var(--ink);
  font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-weight: 500;
  overscroll-behavior: none;
  touch-action: none;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.hidden { display: none !important; }

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
}

.hud-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.hud-bottom {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.icon-button {
  pointer-events: auto;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.55);
  color: var(--ink);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--shadow);
}

.level-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Unbounded', 'Onest', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.02em;
}

.level-caption {
  font-family: 'Onest', sans-serif;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.55;
}

.tool {
  pointer-events: auto;
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  max-width: 116px;
  min-height: 48px;
  padding: 8px 6px 6px;
  border: none;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.62);
  color: var(--ink);
  font-family: inherit;
  font-weight: 600;
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--shadow);
  transition: transform 0.09s ease;
}

.tool:active { transform: translateY(2px); box-shadow: none; }
.tool[disabled] { opacity: 0.42; }

.tool-icon { display: block; font-size: 18px; line-height: 1.1; }
.tool-label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tool-badge {
  position: absolute;
  top: 4px;
  right: 6px;
  min-width: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--wood);
  color: #FBF6EC;
  font-size: 10px;
  line-height: 16px;
}

.tool-badge.reward { background: #D4553F; }

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(242, 234, 218, 0.62);
  backdrop-filter: blur(1px);
  z-index: 5;
}

.logo {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: clamp(30px, 11vw, 46px);
  letter-spacing: 0.01em;
  margin-bottom: 14px;
}

.progress {
  width: min(240px, 70vw);
  height: 8px;
  border-radius: 4px;
  background: rgba(154, 123, 82, 0.25);
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: var(--wood);
  transition: width 0.2s ease;
}

#screen-loading { flex-direction: column; }

/* Карточка победы стоит внизу: игрок должен увидеть, что прибавилось в городе. */
#screen-win { align-items: flex-end; padding-bottom: max(24px, env(safe-area-inset-bottom)); }

.menu-card {
  width: min(340px, 100%);
  padding: 26px 22px;
  border-radius: 26px;
  background: var(--card);
  box-shadow: 0 10px 0 var(--shadow);
  text-align: center;
}

.menu-note {
  margin: 0 0 18px;
  font-size: 14px;
  line-height: 1.45;
  opacity: 0.72;
}

.primary {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 18px;
  background: var(--wood);
  color: #FBF6EC;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 4px 0 #7E6242;
}

.primary:active { transform: translateY(3px); box-shadow: none; }

.menu-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 13px;
  opacity: 0.75;
}

.link {
  border: none;
  background: none;
  color: var(--ink);
  font: inherit;
  text-decoration: underline;
  cursor: pointer;
}

.win-title {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 22px;
  margin-bottom: 10px;
}

.stars { font-size: 34px; letter-spacing: 6px; color: #E2A238; margin-bottom: 8px; }
.stars span.off { color: rgba(46, 42, 36, 0.18); }

.win-stats { font-size: 14px; opacity: 0.7; }
.win-city { font-size: 13px; opacity: 0.62; margin: 6px 0 18px; }

.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 10px;
  padding: 13px 16px;
  border: none;
  border-radius: 16px;
  background: rgba(154, 123, 82, 0.14);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}

.toggle-state { opacity: 0.6; font-weight: 500; }
.toggle.danger { color: #B5432F; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 22%;
  transform: translateX(-50%);
  padding: 10px 16px;
  border-radius: 14px;
  background: rgba(46, 42, 36, 0.88);
  color: #FBF6EC;
  font-size: 13px;
  z-index: 8;
  pointer-events: none;
}

@media (max-height: 620px) {
  .menu-card { padding: 18px 16px; }
  .tool { font-size: 10px; padding: 6px 4px 5px; }
}

</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <button class="icon-button" id="btn-menu" type="button" aria-label="Меню">‹</button>
    <div class="level-badge"><span class="level-caption">Уровень</span><span id="level-number">1</span></div>
    <button class="icon-button" id="btn-settings" type="button" aria-label="Настройки">⚙</button>
  </div>
  <div class="hud-bottom">
    <button class="tool" id="btn-undo" type="button">
      <span class="tool-icon">↺</span><span class="tool-label">Отменить</span><span class="tool-badge" id="undo-badge">3</span>
    </button>
    <button class="tool" id="btn-hint" type="button">
      <span class="tool-icon">?</span><span class="tool-label">Подсказка</span><span class="tool-badge" id="hint-badge">2</span>
    </button>
    <button class="tool" id="btn-post" type="button">
      <span class="tool-icon">+</span><span class="tool-label">Столбик</span><span class="tool-badge" id="post-badge">1</span>
    </button>
  </div>
</div>

const __src_ui_debug_js = (() => {
// Оверлей отладки: включается тройным тапом по номеру уровня.
// Нужен, чтобы настраивать композицию с телефона, где нет консоли.

const TAP_WINDOW_MS = 700;
const TAPS_TO_TOGGLE = 3;
const FPS_SMOOTHING = 0.9;

function createDebug() {
  let root = null;
  let panel = null;
  let cityFrame = null;
  let fieldFrame = null;
  let visible = false;
  let fps = 0;
  let last = 0;
  let taps = 0;
  let firstTap = 0;

  const trigger = document.getElementById('level-number');
  if (trigger) {
    trigger.style.pointerEvents = 'auto';
    trigger.addEventListener('pointerdown', () => {
      const now = Date.now();
      if (now - firstTap > TAP_WINDOW_MS) {
        firstTap = now;
        taps = 0;
      }
      taps += 1;
      if (taps >= TAPS_TO_TOGGLE) {
        taps = 0;
        toggle();
      }
    });
  }

  function build() {
    root = document.createElement('div');
    root.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9';
    cityFrame = frame('rgba(59, 113, 164, 0.85)', 'город');
    fieldFrame = frame('rgba(212, 85, 63, 0.85)', 'поле');
    panel = document.createElement('div');
    panel.style.cssText = [
      'position:absolute',
      'left:8px',
      'top:64px',
      'padding:6px 8px',
      'border-radius:8px',
      'background:rgba(46, 42, 36, 0.82)',
      'color:#FBF6EC',
      'font:600 11px/1.5 ui-monospace, monospace',
      'white-space:pre'
    ].join(';');
    root.appendChild(cityFrame.box);
    root.appendChild(fieldFrame.box);
    root.appendChild(panel);
    document.body.appendChild(root);
  }

  function frame(color, title) {
    const box = document.createElement('div');
    box.style.cssText = `position:absolute;border:1px dashed ${color};background:${color.replace('0.85', '0.08')}`;
    const label = document.createElement('span');
    label.textContent = title;
    label.style.cssText = `position:absolute;right:2px;top:1px;font:600 9px/1 ui-monospace, monospace;color:${color}`;
    box.appendChild(label);
    return { box, label };
  }

  function place(target, rect) {
    target.box.style.left = `${rect.x}px`;
    target.box.style.top = `${rect.y}px`;
    target.box.style.width = `${rect.width}px`;
    target.box.style.height = `${rect.height}px`;
  }

  function toggle() {
    if (!root) build();
    visible = !visible;
    root.style.display = visible ? 'block' : 'none';
  }

  return {
    isVisible() {
      return visible;
    },
    toggle,
    update(info) {
      const now = info.time;
      if (last > 0) {
        const instant = 1000 / Math.max(1, now - last);
        fps = fps === 0 ? instant : fps * FPS_SMOOTHING + instant * (1 - FPS_SMOOTHING);
      }
      last = now;
      if (!visible || !info.layout) return;
      place(cityFrame, info.layout.city);
      place(fieldFrame, info.layout.field);
      panel.textContent = [
        `fps ${fps.toFixed(0)}`,
        `экран ${Math.round(info.layout.width)}×${Math.round(info.layout.height)} dpr ${info.dpr}`,
        `кубик ${info.layout.cubeWidth.toFixed(1)} px, шаг ${info.layout.spacing.toFixed(1)}`,
        `столбиков ${info.layout.posts.length} в ${info.layout.rows} ряд(а)`,
        `уровень ${info.level}, par ${info.par}, ходов ${info.moves}`
      ].join('\n');
    }
  };
}

return { createDebug };
})();

      if (bridge && bridge.platform && bridge.platform.sendMessage) {
        bridge.platform.sendMessage('gameplay_started');
      }

    gameplayStop() {
      if (bridge && bridge.platform && bridge.platform.sendMessage) {
        bridge.platform.sendMessage('gameplay_stopped');
      }

      return new Promise((resolve) => {
        const handler = (state) => {
          if (state === 'closed' || state === 'failed') {
            bridge.advertisement.off('interstitial_state_changed', handler);

        bridge.advertisement.on('interstitial_state_changed', handler);

          if (state === 'closed' || state === 'failed') {
            bridge.advertisement.off('rewarded_state_changed', handler);
            resolve(rewarded);
          }

      } catch (error) {
        // Ничего не поделать.
      }
    },
    async load() {
      if (bridge && bridge.storage) {
        try {
          const data = await bridge.storage.get(SAVE_KEY);
          if (data) return data;
        } catch (error) {
          // Падаем на localStorage.
        }

const LEVEL_SEED_OFFSET = 13;

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });

const app = {
  screen: 'loading',
  dpr: 1,
  layout: null,
  level: 1,
  state: null,
  history: createHistory(),
  city: createCity(),
  fx: createFx(),
  tweens: createTweenPool(),
  hand: null,
  flight: null,
  hidden: null,
  landing: null,
  wave: null,
  shake: null,
  hint: null,
  pending: [],
  hintPulse: 0,
  hintUntil: 0,
  cityAppear: null,
  fade: 0,
  busy: false,
  paused: false,
  time: 0,
  undoUsed: 0,
  hintsUsed: 0,
  extraPostUsed: false,
  settings: { muted: false, vibro: true },
  progress: { level: 1 }
};

const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reducedMotion) {
  setTimeScale(0.4);
  app.fx.reducedMotion = true;
}

const hud = createHud({
  undo: () => requestUndo(),
  hint: () => requestHint(),
  post: () => requestExtraPost(),
  settings: () => screens.showSettings(app.settings, app.screen === 'game'),
  menu: () => openMenu()
});

const debug = createDebug();

const screens = createScreens({
  play: () => startGame(),
  next: () => nextLevel(),
  openSettings: () => screens.showSettings(app.settings, app.screen === 'game'),
  closeSettings: () => {
    screens.hideSettings();
    persist();
  },
  restart: () => {
    screens.hideSettings();
    restartLevel();
  },
  toggleSound: () => {
    app.settings.muted = !app.settings.muted;
    sfx.setMuted(app.settings.muted);
    screens.showSettings(app.settings, app.screen === 'game');
  },
  toggleVibro: () => {
    app.settings.vibro = !app.settings.vibro;
    screens.showSettings(app.settings, app.screen === 'game');
  },
  resetProgress: () => {
    app.progress.level = 1;
    app.level = 1;
    resetCity(app.city);
    persist();
    screens.hideSettings();
    openMenu();
  }
});

function vibrate(ms) {
  if (!app.settings.vibro || !navigator.vibrate) return;
  navigator.vibrate(ms);
}

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  // Выше 2x бюджетные телефоны не тянут.
  app.dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  canvas.width = Math.round(width * app.dpr);
  canvas.height = Math.round(height * app.dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  rebuildLayout(width, height);
}

function rebuildLayout(width, height) {
  const postCount = app.state ? app.state.posts.length : 5;
  const capacity = app.state ? app.state.capacity : 4;
  app.layout = computeLayout(
    width || window.innerWidth,
    height || window.innerHeight,
    postCount,
    capacity
  );
  app.city.dirty = true;
}

// Уровни после 60-го считаются на лету — один раз при старте уровня,
// а не на каждый ход. par считается так же, как в офлайн-генераторе.
function levelData(id) {
  if (id <= LEVELS.length) return LEVELS[id - 1];
  const level = generateLevel(id, (id * LEVEL_SEED_BASE + LEVEL_SEED_OFFSET) >>> 0);
  const optimal = findOptimal(level.posts, level.capacity, PAR_MAX_DEPTH, LOOSE_LEVEL_NODES);
  return {
    id,
    capacity: level.capacity,
    colors: level.colors,
    posts: level.posts,
    parMoves: optimal === null ? Math.max(1, Math.round(level.parMoves * INEXACT_PAR_FACTOR)) : optimal
  };
}

function startLevel(id) {
  app.level = id;
  app.state = createState(levelData(id));
  clearHistory(app.history);
  app.hand = null;
  app.flight = null;
  app.hidden = null;
  app.landing = null;
  app.wave = null;
  app.shake = null;
  app.hint = null;
  app.pending.length = 0;
  app.cityAppear = null;
  app.busy = false;
  app.undoUsed = 0;
  app.hintsUsed = 0;
  app.extraPostUsed = false;
  sfx.resetCombo();
  rebuildLayout();
  updateHud();
  hud.setLevel(id);
  platform.gameplayStart();
}

function updateHud() {
  hud.update({
    undoUsed: app.undoUsed,
    hintsUsed: app.hintsUsed,
    extraPostUsed: app.extraPostUsed,
    canUndo: canUndo(app.history)
  });
}

function startGame() {
  app.screen = 'game';
  screens.hideAll();
  hud.show();
  startLevel(app.progress.level);
}

function openMenu() {
  app.screen = 'menu';
  platform.gameplayStop();
  hud.hide();
  screens.showMenu(app.progress.level);
}

function restartLevel() {
  if (app.busy) return;
  startLevel(app.level);
}

// --- ходы -----------------------------------------------------------------

function onTap(index) {
  if (app.screen !== 'game' || index < 0) return;
  // Тапы во время анимации не теряются, а ждут её конца: иначе быстрая
  // серия ходов ощущается как «не нажалось». Очередь короткая — двух
  // хватает на пару «взял — положил», больше копить вредно.
  if (app.busy) {
    if (app.pending.length < PENDING_LIMIT) app.pending.push(index);
    return;
  }
  app.hint = null;
  if (!app.hand) {
    takeGroup(index);
    return;
  }
  if (index === app.hand.from) {
    returnGroup();
    return;
  }
  if (canMove(app.state.posts, app.hand.from, index, app.state.capacity)) {
    startFlight(index);
  } else {
    denyMove(index);
  }
}

function takeGroup(index) {
  const group = takeTopGroup(app.state.posts, index);
  if (!group) return;
  app.hand = { from: index, color: group.color, count: group.count, lift: 0, bob: 0 };
  addTween(app.tweens, {
    duration: LIFT_MS,
    easing: EASING.easeOutQuad,
    onUpdate: (t) => {
      if (app.hand) app.hand.lift = t;
    }
  });
  sfx.playTake();
  vibrate(VIBRO_TAKE);
}

function returnGroup() {
  const hand = app.hand;
  if (!hand) return;
  app.busy = true;
  addTween(app.tweens, {
    duration: LIFT_MS,
    easing: EASING.easeOutQuad,
    onUpdate: (t) => {
      if (app.hand) app.hand.lift = 1 - t;
    },
    onDone: () => {
      app.hand = null;
      app.busy = false;
    }
  });
}

function denyMove(index) {
  sfx.playDeny();
  app.busy = true;
  const started = app.time;
  addTween(app.tweens, {
    duration: DENY_MS,
    onUpdate: (t) => {
      const decay = 1 - t;
      app.shake = {
        index,
        offset: Math.sin(t * Math.PI * 2 * DENY_CYCLES) * DENY_AMPLITUDE * decay
      };
    },
    onDone: () => {
      app.shake = null;
      app.busy = false;
    }
  });
  return started;
}

function startFlight(to) {
  const hand = app.hand;
  const from = hand.from;
  const count = hand.count;
  const color = hand.color;
  const layout = app.layout;
  const baseSlot = app.state.posts[from].length - count;

  pushHistory(app.history, {
    posts: app.state.posts,
    cityCount: app.city.buildings.length,
    moves: app.state.moves
  });

  const start = slotPosition(layout, from, baseSlot);
  const startY = start.y - hand.lift * layout.size * 1.5;
  const end = slotPosition(layout, to, app.state.posts[to].length);
  const peak = Math.min(startY, end.y) - ARC_HEIGHT;

  app.hand = null;
  app.hidden = { post: from, count };
  app.busy = true;
  app.flight = { color, count, x: start.x, y: startY, groundY: layout.posts[to].baseY };

  addTween(app.tweens, {
    duration: FLIGHT_BASE_MS + FLIGHT_PER_CUBE_MS * (count - 1),
    easing: EASING.easeInOutQuad,
    onUpdate: (t) => {
      const x = start.x + (end.x - start.x) * t;
      // Парабола через три точки: старт, вершина дуги, посадка.
      const y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * peak + t * t * end.y;
      app.flight.x = x;
      app.flight.y = y;
    },
    onDone: () => finishFlight(from, to, count, color, end)
  });
}

function finishFlight(from, to, count, color, end) {
  app.state.posts = applyMove(app.state.posts, from, to, app.state.capacity);
  app.state.moves += 1;
  app.flight = null;
  app.hidden = null;

  const landedFrom = app.state.posts[to].length - count;
  app.landing = { post: to, fromSlot: landedFrom, squash: SQUASH_FROM };
  addTween(app.tweens, {
    duration: SQUASH_MS,
    easing: EASING.easeOutBack,
    onUpdate: (t) => {
      if (app.landing) app.landing.squash = SQUASH_FROM + (1 - SQUASH_FROM) * t;
    },
    onDone: () => {
      app.landing = null;
    }
  });

  spawnSplinters(app.fx, end.x, end.y, color);
  sfx.playPlace();
  vibrate(VIBRO_PLACE);
  updateHud();

  if (isPostComplete(app.state.posts[to], app.state.capacity)) {
    completePost(to, color);
    return;
  }
  addTween(app.tweens, {
    duration: LAND_MS,
    onDone: () => {
      app.busy = false;
      checkWin();
    }
  });
}

function completePost(index, color) {
  sfx.playComplete();
  vibrate(VIBRO_COMPLETE);
  shakeCamera(app.fx);
  const waveDuration = WAVE_STEP_MS * (app.state.capacity + 2);
  app.wave = { post: index, t: 0 };
  addTween(app.tweens, {
    duration: waveDuration,
    onUpdate: (t) => {
      if (app.wave) app.wave.t = t * (app.state.capacity + 1);
    },
    onDone: () => {
      app.wave = null;
    }
  });

  const building = prepareBuilding(app.city, color, app.level);
  app.cityAppear = {
    t: 0,
    draw(target, rect) {
      drawBuilding(target, rect, app.city, building, this.t);
    }
  };
  addTween(app.tweens, {
    duration: HOUSE_MS,
    easing: EASING.easeOutBack,
    onUpdate: (t) => {
      if (app.cityAppear) app.cityAppear.t = t;
    },
    onDone: () => {
      app.cityAppear = null;
      commitBuilding(app.city, building);
      app.busy = false;
      persist();
      checkWin();
    }
  });
}

function checkWin() {
  if (!isSolved(app.state.posts, app.state.capacity)) return;
  app.busy = true;
  platform.gameplayStop();
  sfx.playWin();
  app.progress.level = app.level + 1;
  persist();
  addTween(app.tweens, {
    duration: 420,
    onDone: () => {
      app.screen = 'win';
      hud.hide();
      screens.showWin({
        stars: stars(app.state.moves, app.state.parMoves),
        moves: app.state.moves,
        cityCount: app.city.buildings.length
      });
      app.busy = false;
    }
  });
}

async function nextLevel() {
  screens.hideAll();
  // Реклама только между уровнями и только когда ничего не анимируется.
  if (platform.canShowInterstitial(app.level)) {
    sfx.setMuted(true);
    await platform.showInterstitial(app.level);
    sfx.setMuted(app.settings.muted);
  }
  app.screen = 'game';
  hud.show();
  fadeTransition(() => startLevel(app.progress.level));
}

function fadeTransition(action) {
  app.busy = true;
  addTween(app.tweens, {
    duration: TRANSITION_MS / 2,
    easing: EASING.easeInOutCubic,
    onUpdate: (t) => {
      app.fade = t;
    },
    onDone: () => {
      action();
      addTween(app.tweens, {
        duration: TRANSITION_MS / 2,
        easing: EASING.easeInOutCubic,
        onUpdate: (t) => {
          app.fade = 1 - t;
        },
        onDone: () => {
          app.fade = 0;
          app.busy = false;
        }
      });
    }
  });
}

// --- помощь ---------------------------------------------------------------

async function requestUndo() {
  if (app.busy || !canUndo(app.history)) return;
  if (app.undoUsed >= FREE_UNDO && !(await earnReward())) return;
  const snapshot = popHistory(app.history);
  if (!snapshot) return;
  app.state.posts = snapshot.posts;
  app.state.moves = snapshot.moves;
  trimCity(app.city, snapshot.cityCount);
  app.hand = null;
  app.hidden = null;
  app.undoUsed += 1;
  sfx.playTake();
  updateHud();
  persist();
}

async function requestHint() {
  if (app.busy) return;
  if (app.hintsUsed >= FREE_HINTS && !(await earnReward())) return;
  const move = findHint(app.state.posts, app.state.capacity);
  if (!move) {
    screens.toast('Ходов не осталось — попробуй «Заново»');
    return;
  }
  app.hand = null;
  app.hint = move;
  app.hintUntil = app.time + HINT_SHOW_MS;
  app.hintsUsed += 1;
  updateHud();
}

async function requestExtraPost() {
  if (app.busy || app.extraPostUsed) return;
  if (!(await earnReward())) return;
  app.state.posts = app.state.posts.map((post) => post.slice());
  app.state.posts.push([]);
  app.extraPostUsed = true;
  app.hand = null;
  clearHistory(app.history);
  rebuildLayout();
  updateHud();
}

async function earnReward() {
  sfx.setMuted(true);
  const rewarded = await platform.showRewarded();
  sfx.setMuted(app.settings.muted);
  if (!rewarded) screens.toast('Награда не получена');
  return rewarded;
}

// --- сохранение -----------------------------------------------------------

function persist() {
  platform.save({
    level: app.progress.level,
    city: app.city.buildings,
    muted: app.settings.muted,
    vibro: app.settings.vibro
  });
}

async function restore() {
  const data = await platform.load();
  if (!data) return;
  app.progress.level = Math.max(1, Number(data.level) || 1);
  app.settings.muted = Boolean(data.muted);
  app.settings.vibro = data.vibro !== false;
  if (Array.isArray(data.city)) {
    app.city.buildings = data.city.slice();
    app.city.dirty = true;
  }
  sfx.setMuted(app.settings.muted);
}

// --- цикл -----------------------------------------------------------------

function frame(now) {
  const dt = Math.min(MAX_DELTA, now - app.time || 0);
  app.time = now;
  if (!app.paused) {
    updateTweens(app.tweens, dt);
    updateFx(app.fx, dt);
    if (app.hand) {
      app.hand.bob = Math.sin((now / BOB_PERIOD) * Math.PI * 2) * BOB_AMPLITUDE;
    }
    if (!app.busy && app.pending.length > 0) onTap(app.pending.shift());
    if (app.hint && now > app.hintUntil) app.hint = null;
    app.hintPulse = 0.5 + 0.5 * Math.sin((now / 700) * Math.PI * 2);
  }
  render();
  debug.update({
    time: now,
    dpr: app.dpr,
    layout: app.layout,
    level: app.level,
    par: app.state ? app.state.parMoves : 0,
    moves: app.state ? app.state.moves : 0
  });
  requestAnimationFrame(frame);
}

function render() {
  if (!app.layout) return;
  drawScene(ctx, {
    layout: app.layout,
    dpr: app.dpr,
    posts: app.state ? app.state.posts : [],
    city: app.city,
    cityAppear: app.cityAppear,
    hand: app.hand,
    flight: app.flight,
    hidden: app.hidden,
    landing: app.landing,
    wave: app.wave,
    shake: app.shake,
    hint: app.hint,
    hintPulse: app.hintPulse,
    fx: app.fx,
    fade: app.fade
  });
}

// --- ввод -----------------------------------------------------------------

// Только pointerdown: touchstart вместе с mousedown дают двойное срабатывание.
canvas.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  sfx.resumeAudio();
  if (!app.layout || app.screen !== 'game') return;
  const rect = canvas.getBoundingClientRect();
  const index = hitTest(app.layout, event.clientX - rect.left, event.clientY - rect.top);
  onTap(index);
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
document.addEventListener('contextmenu', (event) => event.preventDefault());
document.addEventListener('gesturestart', (event) => event.preventDefault());
document.addEventListener('dblclick', (event) => event.preventDefault());

document.addEventListener('visibilitychange', () => {
  setPaused(document.hidden);
});

window.addEventListener('message', (event) => {
  if (event.data === 'game_api_pause') setPaused(true);
  if (event.data === 'game_api_resume') setPaused(false);
});

function setPaused(paused) {
  app.paused = paused;
  if (paused) sfx.suspendAudio();
  else sfx.resumeAudio();
}

// --- старт ----------------------------------------------------------------

async function boot() {
  screens.setProgress(0.1);
  resize();
  screens.setProgress(0.35);
  await platform.initPlatform();
  screens.setProgress(0.6);
  await restore();
  sfx.initAudio();
  screens.setProgress(0.85);
  if (document.fonts && document.fonts.ready) {
    try {
      await document.fonts.ready;
    } catch (error) {
      // Шрифты не критичны — играем системными.
    }
  }
  screens.setProgress(1);
  requestAnimationFrame(frame);
  // LoadingAPI.ready() — ровно один раз, после первого отрисованного кадра.
  requestAnimationFrame(() => {
    platform.ready();
    openMenu();
  });
}

boot();

return {  };
})();
</script>
